name: Alerte stock poudres

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verification des stocks
        run: python3 check_stock.py

      - name: Sauvegarde de l etat
        if: always()
        run: |
          git config user.name "alerte-poudres"
          git config user.email "actions@users.noreply.github.com"
          git add etat.json
          git diff --staged --quiet || (git commit -m "verification" && git push)
